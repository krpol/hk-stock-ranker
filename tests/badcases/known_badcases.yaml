# Known Badcases — 真实股票回归验证集
#
# 每个 case 由历史 bug 反推沉淀，针对 data/csv/hk_financial.csv 实际值断言。
# 任何重构使老 bug 复现，pytest tests/test_known_badcases.py 立即 fail。
#
# ============================================================
# 【强制流程】发现任何新 badcase 必须做以下动作：
#   1. 用户/自测发现某只股票字段有问题 → 定位修复根因
#   2. 修复后，在本文件 cases: 列表末尾追加一条 case
#      必填字段：issue（格式 BN）、code（5 位字符串）、name、desc（说明 bug 来源）、expect
#   3. 跑 pytest tests/test_known_badcases.py 验证新 case 通过
#   4. 跑全量 pytest 确认无回归
#   5. 提交（本 yaml 与修复代码放同一 commit）
#
# 不允许在不新增 case 的情况下修复 bug——badcase 是 bug 存在证明。
# ============================================================
#
# expect 字段语法：
#   exact: <value>            严格相等（数值或字符串）
#   approx: <number>          浮点近似（绝对误差 1e-6）
#   lt: <number>              字段值 < number
#   le: <number>              字段值 ≤ number
#   gt: <number>              字段值 > number
#   ge: <number>              字段值 ≥ number
#   range: [min, max]         min ≤ 字段值 ≤ max
#   contains: ["sub1", ...]   字符串包含全部子串
#   not_equal_to_field: <other_field>   不等于另一字段值
#   non_empty: true           非空（非 NaN、非空串）
#
# ⚠️ 阈值写科学计数法必须带小数点和符号（1.0e9 会被 PyYAML 解析成**字符串**，
#    导致比较时 TypeError）。写 1000000000 或 1.0e+9，不要写 1.0e9。

cases:
  # ---------------- B2: 未表决预案虚高 ----------------
  - issue: B2
    code: "02355"
    name: 宝业集团
    desc: |
      AKShare 派息表中含 ex_date=NaT 的特别分配 5.5 港元（董事会建议未通过股东大会）。
      旧实现把 5.5 计入 fy_div，导致虚高（应 ≈ 0.096）。
      修复：compute_dividend_fields 跳过 ex_date=NaT 的记录。
    expect:
      fy_div_per_share: { lt: 1.0 }       # 防虚高，绝不能 ≥ 5
      forward_div_per_share: { lt: 1.0 }

  # ---------------- B5: 8 月底财年中报期识别 ----------------
  - issue: B5
    code: "01890"
    name: 中国科培
    desc: |
      fy_anchor=(8,31)，2026-02-28 中报已发但无派息。
      旧实现用 2024 闰年算 interim_md=(2,29)，过滤掉非闰年的 (2,28) 中报期。
      修复：用「月份匹配 + 月末容差 (≥28)」替代严格 (month, day) 相等。

      【2026-10-05 去时间化】原断言写死 current_fy_end=2025-08-31 /
      latest_period_end=2026-02-28，财年滚到 FY2026 后必然 FAIL。
      本 case 的真实守护点是「平年 (2,28) 中报期不被闰年 md 误过滤」——
      即 fiscal_periods 必须同时含年报期(08-31)与中报期(02-2x)，与具体年份无关。
      精确的期归属已由 tests/test_dividend_cross_fy_attribution.py 用固定
      today 做确定性覆盖。
    expect:
      fiscal_periods: { contains: ["-08-31", "-02-2"] }

  - issue: B5
    code: "01773"
    name: 天立国际控股
    desc: 8 月底财年，B5 修复后 fiscal_periods 必须含中报期（平年 02-28 不被过滤）。
    expect:
      fiscal_periods: { contains: ["-08-31", "-02-2"] }

  - issue: B5
    code: "01969"
    name: 中国春来
    desc: 8 月底财年，B5 修复后 fiscal_periods 必须含中报期（平年 02-28 不被过滤）。
    expect:
      fiscal_periods: { contains: ["-08-31", "-02-2"] }

  # ---------------- B5 间接验证：12 月底财年 5 月时点正常态 ----------------
  # 这些股票在 B5 修复后字段值发生变化（fiscal_periods 等），用于验证修复后稳态。
  - issue: B5
    code: "00270"
    name: 粤海投资
    desc: 12 月底财年，B5 修复后 fiscal_periods 应包含中报期 6-30。
    expect:
      fiscal_periods: { contains: ["2025-12-31", "2025-06-30"] }
      current_fy_end: { exact: "2025-12-31" }

  - issue: B5
    code: "01070"
    name: TCL 电子
    expect:
      fiscal_periods: { contains: ["2025-12-31", "2025-06-30"] }

  - issue: B5
    code: "01099"
    name: 国药控股
    expect:
      fiscal_periods: { contains: ["2025-12-31", "2025-06-30"] }

  - issue: B5
    code: "01272"
    name: 大唐环境
    expect:
      fiscal_periods: { contains: ["2025-12-31", "2025-06-30"] }

  - issue: B5
    code: "01599"
    name: 城建设计
    expect:
      fiscal_periods: { contains: ["2025-12-31", "2025-06-30"] }

  - issue: B5
    code: "01798"
    name: 大唐新能源
    expect:
      fiscal_periods: { contains: ["2025-12-31", "2025-06-30"] }

  # ---------------- B7: AKShare 派息方案缺「元」字导致漏统 ----------------
  - issue: B7
    code: "02602"
    name: 万物云
    desc: |
      AKShare 2024 中期分配方案原文为「每股派人民币0.562元(相当于港币0.622)」，
      末尾缺「元」字，B7 修复前正则 r"相当于...港币\s*([\d.]+)\s*元" 匹配失败，
      导致该笔 0.622 HKD 被 silently 丢弃，prev_year_div 少算（1.457 而非 2.079）。
      修复：4 条 pattern 末尾「元」改为「元?」（可选）。

      【2026-10-05 去时间化】原断言盯 prev_year/fy_div，但 TTM 窗口每半年推进一期，
      那笔 0.622 会依次滑过 fy → prev → two_years_ago → 滑出，断言必然过期。
      改为盯**那笔钱当前所在的窗口**：0.622 归 2024-06-30 中报期，
      与同财年年报 0.8553 合计 1.4773。实测若正则再次漏解析则降为 0.8553 → 触发失败。
      正则本身的守护已下移到 tests/test_dividend_attribution.py::test_D1_parse_dividend_amount
      （直接用该条缺「元」字的真实原文做断言，完全不依赖时间）。
    expect:
      two_years_ago_div_per_share: { range: [1.4, 1.7] }

  # ---------------- B9: 单日成交额采样偏差导致冷门股被永久踢出 ----------------
  - issue: B9
    code: "01245"
    name: NIRAKU
    desc: |
      rebuild-pool 时单日快照 amount 过滤：若 rebuild 当天恰好停牌/零成交，
      该股会被踢出 stock_pool 全年；下次 rebuild（默认 365 天后）才有机会再入。
      01245 NIRAKU 在 2026/05/22 rebuild 当天 amount=0，但 5/27 ~80 万、5/29 ~20 万港元成交，
      实际是流动性可接受的冷门票，旧逻辑导致它从 pool/financial/ranking 全部消失。
      修复（B9）：单日不过的票，用 yfinance 拉近 N=5 个交易日 max(close*volume) 复核，
      只要窗口内任一天满足门槛（10000 港元）即入池；新增 --liquidity-window CLI 控制窗口大小。

      【B9 实跑验证（2026-06-01）】：B9 复核机制本身工作正常，对 804 只单日 fail 的票补回 344 只。
      01245 当日 amount=68,778 港元 > 1万门槛，单日 Step 2 就通过（未走 B9 复核）。
      但 01245 在 Step 4 「合股/增发过滤」被误杀（B10：has_share_dilution 单点噪声误判）。
      B10 已修复 + has_share_dilution('01245') 函数级别已返回 False。

      【2026-08-02 结案】01245 已恢复进入 stock_pool（name=NIRAKU）与 hk_financial.csv，
      按上述待办恢复 require_present: true。

      同时修正断言字段：原用 `name: {exact: NIRAKU}` 探测存在性，但
      hk_financial.csv 从设计上就不含 name 列（近 12 次提交均无），该断言恒 FAIL。
      本 case 的真实意图是「01245 不得被流动性/增发过滤误踢出池」，
      这已由 require_present: true 精确表达（code 不在 financial.csv 即 fail）。
      再补一条业务字段断言，确保它不只是"存在"而且数据有效。
    require_present: true
    expect:
      total_liability_ratio: { non_empty: true }

  # ---------------- B11: AKShare fiscal_year 偏移导致中报派息错归 ----------------
  - issue: B11
    code: "01890"
    name: 中国科培
    desc: |
      用户报：「半年报没有预分红，同比是下降的」。
      事实：AKShare/yfinance 派息表显示 2026-03-06 中期派 0.07 港元，
      但 financial.csv 中 latest_period_div_per_share=0（应是 0.07）+ fy_div=0.13（应是 0.06，FY2025 仅 2025-08-01 一笔 0.06）。

      根因：AKShare 的 `fiscal_year` 字段对 01890 普遍偏小 1 年（如 2026-03-06 中期标
      fiscal_year=2025，实属 FY2026 中报），旧 R2 规则把它强行归到 2025-08-31 年报期，
      导致 fy_div 双计 + 2026-02-28 中报期 latest_period_div=0。

      修复（B11）：R2 重写为按 distribution_type ("中期"/"年度"/"末期"/"特别") + ex_date
      归到距 ex_date 最近的对应期类型（年报期/中报期），不再信任 AKShare fiscal_year。

      【2026-10-05 去时间化】原断言 latest_period_end=2026-02-28 /
      latest_period_div≈0.07 / fy_div≈0.13 已随财年滚到 FY2026 全部过期
      （现 latest=2026-08-31，fy_div=0.07 —— 2026-03-06 的 0.07 仍在 TTM 内，
      而 2025-08-01 的 0.06 已滑出，归属正确）。
      本 case 的真实守护点是「中期派息不被错归到年报期」。该语义已由
      tests/test_dividend_cross_fy_attribution.py::test_b11_01890_full_scenario
      用固定 today=2026-05-24 + 完整 4 笔派息做确定性覆盖。
      此处只保留与时间无关的结构性守护：中报期必须被识别出来（不被闰年 md 过滤），
      且 latest_period_end 非空。
    expect:
      latest_period_end: { non_empty: true }
      fiscal_periods: { contains: ["-08-31", "-02-2"] }

  # ---------------- B50: 跨年财年 fiscal_year 映射错位（B39-r8 回归） ----------------
  - issue: B50
    code: "01627"
    name: 安保工程控股
    desc: |
      【回归来源】commit 589b620 "B39-r8: 分红归属优先信 fiscal_year"（2026-07-04）。

      B11 当初已诊断出「AKShare fiscal_year 普遍偏小 1 年」并明确决定
      *不再信任 fiscal_year*（见上方 B11 case desc 末句）。B39-r8 为修 01890
      延迟派息，又把策略反转成「优先信 fiscal_year」，导致 B11 结论被推翻、本 case 出现。

      【根因】东财 fiscal_year 对跨年财年用「财年开始的自然年」，
      而 year_to_period 按「财年结束年」建索引 → 非 12 月财年天然差一年。
      错位程度随财年末月份提前而放大：
        01890 财年 8-31：除息延迟 +97~+335 天，被 max_after_days=365 兜住，看似正常
        01627 财年 3-31：除息延迟 +518~+521 天，错位整整一年 → 暴雷

      【实测对比】同一份东财数据，只换 dividend_attribution.py 版本：
        B39-r8 之前：prev_year=0.06  two_yrs_ago=0.05  lp_yoy=0.06   （全对）
        B39-r8 之后：prev_year=0.03  two_yrs_ago=0.06  lp_yoy=0.03   （全错）

      【真实分红】财年 3-31
        FY2027 (除净 2026-08-31, 东财标 fy=2025) = 0.03  未除息
        FY2026 (除净 2025-09-01, 东财标 fy=2024) = 0.06  ← 这才是"上年"
        FY2025 (除净 2024-09-02, 东财标 fy=2023) = 0.05
      真实同比 0.06 → 0.03 = 腰斩 -50%，但系统 ttm_return_yoy 算成 0。

      【修复】_period_for_fy_kind 得出的期需用 ex_date 延迟裁决：
      延迟不落在 [-90, 365) 时改试 fy+1，仍不合理才回退距离匹配。
    expect:
      prev_year_div_per_share: { approx: 0.06 }
      two_years_ago_div_per_share: { approx: 0.05 }

  - issue: B50
    code: "00345"
    name: 维他奶国际
    desc: |
      同 B50 根因的另一表现面（财年同样是 3-31）。
      用户发现「同期上年分红(HKD)」显示 0.1350 —— 等于当期自己，
      真实应为 0.102（FY2026 年度分配，除净日 2025-08-29，东财标 fy=2024）。

      【实测对比】
        B39-r8 之前：lp_yoy=0.102  （正确）
        B39-r8 之后：lp_yoy=0.135  （等于 latest_period_div 自身，明显失真）

      【真实分红】
        2026-08-28  fy=2025 年度  0.135  未除息
        2025-12-09  fy=2025 中期  0.040
        2025-08-29  fy=2024 年度  0.102  ← 同期上年应取这笔
        2024-12-10  fy=2024 中期  0.040
        2024-08-23  fy=2023 年度  0.063

      本 case 同时守护「同期同比不得等于当期自身」这一不变量 ——
      全池曾有 116 只出现该症状，是 B50 错位的批量指纹。
    expect:
      latest_period_yoy_div_per_share: { approx: 0.102 }

  - issue: B50
    code: "00345"
    name: 维他奶国际（同期同比不得等于自身）
    desc: |
      B50 的不变量守护：latest_period_yoy_div 不得等于 latest_period_div。
      拆成独立 case 是因为 YAML 同 key 会互相覆盖，无法在一个 expect 里
      同时写 approx 与 not_equal_to_field。
    expect:
      latest_period_yoy_div_per_share: { not_equal_to_field: latest_period_div_per_share }

  - issue: B50-r2
    code: "02602"
    name: 万物云（窗口下界不得过宽）
    desc: |
      【回归来源】B50 第一版修复自身引入。

      B50 用「fiscal_year 映射 + ex_date 延迟裁决」修正跨年财年错位，
      首版 interim 下界取 -180 天，结果 02602 的 prev_year 从 2.079 虚高到 2.4251。

      【根因】中报期间隔仅 ~182 天。下界取 -180 会让**相邻两个中报期几乎必然
      同时落入窗口**，而「提前」那个的 |delay| 反而更小 → 被优先选中 → 错归。

        02602（12 月财年，中报期 6-30），记录 2024-01-02 中期 fy=2023：
          fy=2023 → 2023-06-30  延迟 +186   -180窗 ✓ | -90窗 ✓
          fy=2024 → 2024-06-30  延迟 -180   -180窗 ✓（|180|<|186| 胜出）❌ | -90窗 ✗
        → -180 下选中 2024-06-30，把 0.3461 错算进 prev_year（2.079 + 0.3461 = 2.4251）

      另一处同源缺陷：「特别分配」被 _classify_distribution 归为 annual，
      但特别分配不依赖年报节奏可随时宣派，用 annual 的硬下界 0 会误踢。

      【修正】按类型分设下界，且不得宽到让相邻同类期同时合格：
        annual  : [0,   365)  必须等年报 + 股东大会，不可能财年结束前除息
        interim : [-90, 365)  可提前，但需窄于半个中报周期
        special : [-90, 365)  不依赖年报节奏（新增 _is_special 判定）
      -90 的依据：实测 01890 最大提前量 -84 天，且与 _pick_nearest_period 既有容差一致。

      本 case 与上方 B7-02602 共用同一只股票但守护不同环节：
      B7 守护「分红方案正则解析」，本 case 守护「归属窗口宽度」。

      【2026-10-05 去时间化】原断言 prev_year ∈ [2.0,2.2] / two_years_ago ∈ [1.4,1.7]
      随 TTM 窗口推进而过期（现 prev_year=2.5，含 2024-10-02 特别分配 0.509，归属正确）。
      改为只守护该 bug 的**直接指纹**：2024-01-02 的中期 0.3461 必须归到 2023-06-30，
      绝不能被 -180 过宽下界错归到 2024-06-30。
      实测：正常 two_years_ago=1.4773；若 0.3461 错归则升到 1.8234 → 越界触发失败。
      窗口下界本身的确定性覆盖见 tests/test_dividend_cross_fy_attribution.py。
    expect:
      two_years_ago_div_per_share: { range: [1.4, 1.7] }

  # ---------------- B53: D&A 双源币种不一致（科目名精确匹配失败） ----------------
  - issue: B53
    code: "01245"
    name: NIRAKU
    desc: |
      【根因】AK_ITEM_MAP["depreciation_amortization"] 映射的科目名是「折旧及摊销」，
      而 AKShare/东财现金流量表真实科目名为「加:折旧及摊销」。AK_ITEM_MAP 走**精确等值匹配**
      → MISS → 回退 yfinance。而 yfinance 返回**公司披露货币**（NIRAKU 为日元），
      AKShare 返回港币，同一函数内两个币种混用 → D&A 被放大约 20 倍（JPY/HKD）。

      【影响】仅 3 个字段：dep_amortization_3y_avg、da_ttm、prev_da。
      它们只用于 min(capex + lease, D&A) 封顶，D&A 虚高 → 上限恒失效 → real_fcf 被低估。
      实测 01245：dep_amortization_3y_avg 41.86 亿 JPY → 1.93 亿 HKD，
      real_fcf_ttm 177 万 → 2827 万，coverage_ratio 0.286 → 0.839，fcf_rating WARN → OK。

      【修复】collectors/hk_financial.py 的映射改为候选列表
      ["加:折旧及摊销", "折旧及摊销"]（取东财官方港币值，不走自算汇率）。
      已核对全部 15 个映射，仅 D&A 一处 MISS。

      【守护思路】币种串台的指纹是数量级跳变（日元对港币约 20x）。
      修复后 dep_amortization_3y_avg = 1.93 亿、da_ttm = 1.89 亿（HKD）；
      若回退 yfinance 取日元值会跳到 41.86 亿 / 40 亿量级，被 10 亿上限拦住。
      教训：AK_ITEM_MAP 是精确等值匹配，新增科目前必须打印
      set(df['STD_ITEM_NAME']) 核对真实科目名，不能凭常识猜。
    expect:
      dep_amortization_3y_avg: { lt: 1000000000 }
      da_ttm: { lt: 1000000000 }

  # ---------------- B54: forward_override 去重基准漏看其他期的 pending ----------------
  - issue: B54
    code: "06181"
    name: 太古
    desc: |
      【发现】B2 全集不变量报 06181 的 fy_div_per_share = 41.622876 > 阈值 30。
      核对东财原始派息：2026-11-27 中期 20.811438 + 2026-05-12 年度 13.65
      = 34.461438 才是真值，41.622876 恰好多出 20.811438 —— 同一笔被计了两次。

      【根因】engine/dividend_attribution.py 的 R4 规则用
      existing_total = period_done[current_fy_year_end] + period_pending[current_fy_year_end]
      作为「AKShare 是否已收录 override 这笔」的判据，**只看了当前财年期**。
      但 override 的语义是「已宣派未除息」，AKShare 可能把它归到别的期：
        06181: 2026-11-27 的中期派息归到 2026-06-30 中报期（pending），
               而 current_fy_year_end = 2025-12-31，该期 pending = 0
        → 误判「AKShare 缺这笔」→ 再注入 20.811438 到 pending → fy_div 虚高一倍派息额

      【修复】existing_total 的 pending 部分改为跨全部期求和：
        existing_total = period_done[current_fy_year_end] + sum(period_pending.values())

      【影响面】全池 245 只有非零 forward_override 的股票中，9 只 fy_div 虚高，全部下修：
        06181 41.622876→34.461438、02885 0.258→0.204、06919 0.28→0.24、
        01093 0.36→0.33、01066 0.197258→0.167429、00842 0.036→0.018、
        00998 0.46924→0.455369、03658 0.192→0.18457、01345 0.112→0.11

      计算逻辑的确定性覆盖见 tests/test_dividend_attribution.py::
      test_D11b_override_already_pending_in_other_period_no_double_count。
      本 case 守护落盘值不再回到双计态：真值 34.461438，双计态为 41.622876。
    expect:
      fy_div_per_share: { lt: 38.0 }

  # ---------------- B55: 过期的 forward_override 快照致大面积双计 ----------------
  - issue: B55
    code: "00316"
    name: 东方海外国际
    desc: |
      【发现】修 B54 后扫双计指纹「fy_div 恰等于 2×forward_div」，命中 62 只。
      抽查发现多数并非「中期+年度等额派息」的巧合，而是同类双计仍在发生。

      【根因】data/csv/hk_forward_dividend.csv 是**某次抓取的快照**（updated_at
      为 2026-09-07），245 条里有 208 条的 ex_date 已经过去。
      forward_div 的语义是「已宣派但未除息」——除息日一过，那笔派息就被 AKShare
      正常收录为已除息（进 period_done），此时再把它当 override 注入，
      R4 的 existing_total 比较看不到它（它在别的期的 **done** 里，
      而 B54 修复后的基准是 done[cur_fy] + 全部 pending）→ 误判缺失 → 重复注入。

      注意这与 B54 是**两个独立缺陷**：B54 修的是 pending 跨期求和，
      本 case 修的是 override 本身已过期、压根不该参与比较。

      【修复】collectors/hk_forward_dividend.py 的 get_forward_div_map
      只返回 ex_date > today 的记录（ex_date 缺失也剔除，无法判定是否已除息）。
      过滤后 245 → 37 条。

      【影响面】53 只 fy_div 虚高，全部下修。典型：
        82020 3.02→1.51、00316 8.58→7.566、80883 1.88→0.94、06869 2.451915→1.565、
        01112 1.64→0.98、09980 6.93346→6.320585、02273 2.3→1.84、02877 1.866→1.42
      修复后双计指纹从 62 只降到 2 只（01525/00855，经核实除息日确在未来、
      override 与 AKShare 同一笔未重复注入，fy==2×fwd 纯因两期等额派息）。

      00316 真值 7.566 = 4.29（2026-09-10 中期）+ 3.276（2026-05-27 年度）。
      计算逻辑的确定性覆盖见 tests/test_dividend_attribution.py::
      test_D11c_forward_div_map_drops_already_ex_dated。
    expect:
      fy_div_per_share: { lt: 8.0 }

# ============================================================
# 全集不变量（不绑定特定 code，对全部股票生效）
# ============================================================
global_invariants:
  - issue: B4
    rule: forward_le_fy
    desc: |
      forward_div_per_share 必须 ≤ fy_div_per_share。
      因 fy_div 已包含 forward 部分，相加会双计（B4 修复内容）。

      【2026-10-05】该不变量在**跨财年边界**不是硬约束，允许少量豁免：
      fy_div 走 TTM 窗口（past_periods，p ≤ today），而 forward_div 还含
      「未来财报期的 pending」，两者口径不同。当某只股宣派了归属**下一财年**
      的派息（典型为除息日在未来的特别分配）时，这笔钱进 forward 但不进 TTM，
      forward > fy 是正确行为，不是双计。
      实例（2026-10-05）：01205 ex=2026-10-14 特别 0.081（fy_div=0）、
                          06186 ex=2026-10-13 特别 0.2905（fy_div=0.2118）。
      改为比例阈值：双计 bug 是系统性的（会命中成百只），而跨财年边界只影响个别股。
      超过 2% 即视为 bug 复现。
    tolerance: 1.0e-6
    max_violation_ratio: 0.02

  - issue: B3
    rule: total_liability_ratio_coverage
    desc: |
      total_liability_ratio 字段必须存在；
      NaN 比例不超过 50%（B3 引入双阈值过滤后的覆盖度保证）。
    max_nan_ratio: 0.5

  - issue: B2
    rule: no_outlier_dividend
    desc: |
      防御性兜底：没有任何股票的 fy_div_per_share / forward_div_per_share 超过阈值。
      避免类似 02355 5.5 港元未表决预案、或解析错误（如把 RMB 当 HKD）的极端异常。

      【2026-10-05 阈值上调 30 → 45，按本文件既有约定「逐一审查后调整」】
      06181 太古 FY2026 TTM = 20.811438（2026-11-27 中期）+ 13.65（2026-05-12 年度）
      = 34.461438，逐笔核对东财原始记录，RMB→HKD 换算正确，属真实高价股派息。
      同期第二名 00945 为 16.28，与 06181 之间有明显断档，45 对两者都留足余量。
      注：此前 06181 曾因 R4 override 双计虚高到 41.62（B54 已修），
      那类 bug 由 tests/test_dividend_attribution.py::
      test_D11b_override_already_pending_in_other_period_no_double_count 精确守护，
      不再依赖本阈值兜底。
    threshold: 45.0
